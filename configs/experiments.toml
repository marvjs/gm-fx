[experiments]
default_timeframe = "M5"
default_count = 10000
minimum_trades = 30
minimum_profit_factor = 1.10
minimum_expectancy = 0.0
maximum_drawdown_percent = 15.0
minimum_profitable_fold_percent = 75.0
minimum_signal_frequency_percent = 0.10

[eligibility]
require_holdout_pass = true
require_walk_forward_stability = true
require_all_cost_scenarios_nonnegative = true
execution_enabled = false

[[strategies]]
id = "baseline_scalper"
kind = "baseline"
enabled = true
config = "configs/strategies/scalp_baseline.toml"

